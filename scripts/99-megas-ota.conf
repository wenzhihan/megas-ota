# MEGAS OTA v9.9.22 - keep sshd reachable across OTA reboot loops.
# Root cause (2026-11-26): default MaxStartups 10:30:100 + lingering
# unauthenticated connections after `systemctl reboot` make sshd reply
# "Exceeded MaxStartups" (or silently drop) -> banner timeout / No existing session.
UseDNS no
MaxStartups 100:30:200
LoginGraceTime 30
